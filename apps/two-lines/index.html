<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Two lines on a black screen. Move a finger over one and it goes.">
<title>Two Lines</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Two Lines">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{ --ink:#000000; }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
  }
  .room{position:fixed;inset:0;overflow:hidden;background:var(--ink);}
  #stage{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;cursor:crosshair;display:block;
    transition:filter 900ms cubic-bezier(.2,.7,.3,1);
  }
  .room.rushing #stage{filter:brightness(1.5) saturate(0.6) blur(2.5px);}

  .flash{
    position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 52%,rgba(255,255,255,0.9),rgba(214,226,255,0.25) 34%,rgba(0,0,0,0) 68%);
  }
  .room.rushing .flash{animation:rush 1900ms cubic-bezier(.16,.8,.3,1) forwards;}
  @keyframes rush{
    0%{opacity:0;transform:scale(.4);}
    12%{opacity:.85;}
    100%{opacity:0;transform:scale(1.9);}
  }
  @media (prefers-reduced-motion:reduce){
    .room.rushing #stage{filter:brightness(1.2);}
    .room.rushing .flash{animation:none;opacity:0;}
    #stage{transition:none;}
  }
</style>

</head>
<body>
<div class="room" id="room">
  <canvas id="stage"></canvas>
  <div class="flash" aria-hidden="true"></div>
</div>

<script>
(function(){
  "use strict";
  var stage = document.getElementById('stage');
  var ctx = stage.getContext('2d');
  var room = document.getElementById('room');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DPR = 1, W = 0, H = 0;
  var SEG = 96;
  var BRUSH = 30;
  var lines = [];
  var flying = [];
  var powder, pctx;
  var pointer = {x:0, y:0, down:false};
  var suction = 0;
  var rushed = false;

  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function layer(){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    var x = c.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    return [c, x];
  }

  /* ---------- geometry + powder ---------- */

  function layout(){
    var oldW = W, oldH = H, oldPowder = powder;

    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    stage.width = Math.round(W * DPR);
    stage.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var l = layer(); powder = l[0]; pctx = l[1];
    BRUSH = clamp(Math.min(W, H) * 0.095, 28, 52);

    if (!oldPowder || !lines.length || oldW < 1 || oldH < 1){
      build();
      return;
    }

    // A resize (a phone hiding its address bar, a rotation) carries the powder
    // across as it stands — whatever has been taken stays taken. The rack runs
    // vertically, so it scales with the height and gives way to the width only
    // when there is no room, which keeps a rotation reversible.
    var ox = oldW / 2, oy = oldH / 2, nx = W / 2, ny = H / 2;
    var sm = H / oldH;
    var out = 0;
    for (var k = 0; k < lines.length; k++){
      var lk = lines[k], edge = lk.half + lk.reach;
      out = Math.max(out, Math.abs(lk.p0.x - ox) + edge, Math.abs(lk.p1.x - ox) + edge);
    }
    if (out * sm > W * 0.47) sm = (W * 0.47) / out;
    pctx.drawImage(oldPowder, nx - ox * sm, ny - oy * sm, oldW * sm, oldH * sm);
    for (var i = 0; i < lines.length; i++){
      var ln = lines[i];
      ln.p0.x = nx + (ln.p0.x - ox) * sm; ln.p0.y = ny + (ln.p0.y - oy) * sm;
      ln.p1.x = nx + (ln.p1.x - ox) * sm; ln.p1.y = ny + (ln.p1.y - oy) * sm;
      ln.len *= sm;
      ln.half *= sm;
      ln.reach *= sm;
    }
  }

  function build(){
    pctx.clearRect(0, 0, W, H);
    flying.length = 0;
    lines = [];
    rushed = false;
    room.classList.remove('rushing');

    // racked vertically, running the length of the screen
    var len = clamp(Math.min(H * 0.74, 720, H - 150), 170, 720);
    var gap = clamp(Math.min(W * 0.36, 180), 76, 180);
    var half = clamp(len * 0.026, 6, 16);

    var cx = W / 2, cy = H / 2 + 10;

    // you do not have to be on the line, only near it — but never near both
    var reach = clamp(BRUSH * 1.6, 40, gap * 0.44);

    var V = Math.PI / 2;
    // a fat, coarse, generously chopped one
    addLine(cx - gap / 2, cy - rnd(10, 20), len, V - 0.021, half, reach,
            {density:0.92, grain:1.3, clumps:1.6, dust:0.8});
    // and a shorter, tighter, finer one
    addLine(cx + gap / 2, cy + rnd(12, 24), len * rnd(0.84, 0.89), V + 0.011, half * 0.82, reach,
            {density:1.3, grain:0.78, clumps:0.5, dust:1.5});
  }

  function addLine(cx, cy, len, ang, half, reach, style){
    var hx = Math.cos(ang) * len / 2, hy = Math.sin(ang) * len / 2;
    var line = {
      p0:{x:cx - hx, y:cy - hy},
      p1:{x:cx + hx, y:cy + hy},
      len:len, half:half, ang:ang, reach:reach, style:style,
      cells:new Float32Array(SEG),
      remaining:1, done:false
    };
    for (var i = 0; i < SEG; i++) line.cells[i] = 1;
    lines.push(line);
    paintPowder(line);
  }

  function paintPowder(line){
    var p0 = line.p0, p1 = line.p1, half = line.half;
    var st = line.style;
    var nx = -Math.sin(line.ang), ny = Math.cos(line.ang);

    // the pile's soft body, so the powder reads as volume and not just specks
    pctx.save();
    pctx.lineCap = 'round';
    pctx.strokeStyle = 'rgba(206,220,248,0.05)';
    pctx.lineWidth = half * 2.1;
    strokeLine(pctx, p0, p1);
    pctx.strokeStyle = 'rgba(228,238,255,0.16)';
    pctx.lineWidth = half * 1.55;
    strokeLine(pctx, p0, p1);
    pctx.strokeStyle = 'rgba(240,246,255,0.28)';
    pctx.lineWidth = half * 0.95;
    strokeLine(pctx, p0, p1);
    pctx.restore();

    var count = Math.min(19000, Math.round(line.len * 26 * st.density));
    for (var i = 0; i < count; i++){
      var t = Math.random();
      var body = Math.pow(Math.sin(Math.PI * t), 0.32);          // tapers at both ends
      var n = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      var off = n * half * 1.05 * (0.5 + body * 0.5);
      var x = p0.x + (p1.x - p0.x) * t + nx * off;
      var y = p0.y + (p1.y - p0.y) * t + ny * off;
      var edge = 1 - clamp(Math.abs(n), 0, 1);
      var a = (0.3 + Math.random() * 0.68) * (0.42 + edge * 0.58) * (0.45 + body * 0.55);
      var r = (0.4 + Math.random() * Math.random() * 1.9) * st.grain;
      pctx.fillStyle = 'rgba(246,249,255,' + a.toFixed(3) + ')';
      pctx.beginPath();
      pctx.arc(x, y, r, 0, 6.2832);
      pctx.fill();
    }

    // a few coarse clumps along the ridge
    for (var c = 0; c < Math.round(line.len / 4.5 * st.clumps); c++){
      var ct = rnd(0.06, 0.94);
      var cn = rnd(-0.5, 0.5) * half;
      var cxp = p0.x + (p1.x - p0.x) * ct + nx * cn;
      var cyp = p0.y + (p1.y - p0.y) * ct + ny * cn;
      pctx.fillStyle = 'rgba(252,254,255,' + rnd(0.5, 0.95).toFixed(3) + ')';
      pctx.beginPath();
      pctx.arc(cxp, cyp, rnd(1.3, 3.1) * st.grain, 0, 6.2832);
      pctx.fill();
    }

    // stray dust the rack-up left behind
    for (var s = 0; s < Math.round(60 * st.dust); s++){
      var st = rnd(-0.02, 1.02);
      var so = rnd(-1.7, 1.7) * half;
      pctx.fillStyle = 'rgba(232,240,255,' + rnd(0.05, 0.3).toFixed(3) + ')';
      pctx.beginPath();
      pctx.arc(p0.x + (p1.x - p0.x) * st + nx * so, p0.y + (p1.y - p0.y) * st + ny * so, rnd(0.3, 0.9), 0, 6.2832);
      pctx.fill();
    }
  }

  function strokeLine(c, p0, p1){
    c.beginPath();
    c.moveTo(p0.x, p0.y);
    c.lineTo(p1.x, p1.y);
    c.stroke();
  }

  /* ---------- taking it ---------- */

  function stamp(x, y){
    var g = pctx.createRadialGradient(x, y, 0, x, y, BRUSH);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.82, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    pctx.globalCompositeOperation = 'destination-out';
    pctx.fillStyle = g;
    pctx.beginPath();
    pctx.arc(x, y, BRUSH, 0, 6.2832);
    pctx.fill();
    pctx.globalCompositeOperation = 'source-over';
  }

  function eat(line, x, y){
    var dx = line.p1.x - line.p0.x, dy = line.p1.y - line.p0.y;
    var L2 = dx * dx + dy * dy;
    var u = ((x - line.p0.x) * dx + (y - line.p0.y) * dy) / L2;
    var px = line.p0.x + dx * u, py = line.p0.y + dy * u;
    if (u < -0.07 || u > 1.07) return 0;
    var d = Math.hypot(x - px, y - py);
    if (d > line.reach) return 0;

    var uR = (BRUSH * 0.85) / line.len;
    var fall = 1 - 0.35 * Math.pow(clamp(d / line.reach, 0, 1), 4);
    var i0 = Math.max(0, Math.floor((u - uR) * SEG));
    var i1 = Math.min(SEG - 1, Math.ceil((u + uR) * SEG));
    var removed = 0;
    for (var i = i0; i <= i1; i++){
      var cu = (i + 0.5) / SEG;
      var f = 1 - clamp(Math.abs(cu - u) / uR, 0, 1);
      var take = Math.min(line.cells[i], f * fall * 0.9);
      line.cells[i] -= take;
      removed += take;
    }
    if (removed <= 0) return 0;

    line.remaining = Math.max(0, line.remaining - removed / SEG);
    stamp(px, py);
    spill(line, px, py, u, removed / SEG);
    return removed / SEG;
  }

  function spill(line, px, py, u, amount){
    var n = Math.min(7, Math.round(amount * SEG * 9));
    var nx = -Math.sin(line.ang), ny = Math.cos(line.ang);
    for (var i = 0; i < n; i++){
      var off = rnd(-1.4, 1.4) * line.half;
      var along = rnd(-1, 1) * BRUSH * 0.7;
      flying.push({
        x:px + nx * off + Math.cos(line.ang) * along,
        y:py + ny * off + Math.sin(line.ang) * along,
        vx:rnd(-55, 55), vy:rnd(-55, 55),
        r:rnd(0.5, 1.9), life:1
      });
    }
    if (flying.length > 420) flying.splice(0, flying.length - 420);
  }

  function finish(line){
    line.done = true;
    for (var i = 0; i < SEG; i++) line.cells[i] = 0;
    line.remaining = 0;
    // sweep the last specks out of the channel
    pctx.save();
    pctx.globalCompositeOperation = 'destination-out';
    pctx.lineCap = 'round';
    pctx.strokeStyle = 'rgba(0,0,0,1)';
    pctx.lineWidth = (line.half + BRUSH) * 2;
    strokeLine(pctx, line.p0, line.p1);
    pctx.restore();

    sniff();
    buzz([26, 40, 70]);

    if (lines.every(function(l){ return l.done; }) && !rushed){
      rushed = true;
      room.classList.add('rushing');
      rush();
      window.setTimeout(function(){ room.classList.remove('rushing'); }, 1900);
    }
  }

  /* ---------- pointer ---------- */

  var last = null;

  function pos(e){
    var r = stage.getBoundingClientRect();
    return {x:e.clientX - r.left, y:e.clientY - r.top};
  }

  // no press needed: passing over a line is enough, held down or not
  function sweep(p){
    var from = last || p;
    var dist = Math.hypot(p.x - from.x, p.y - from.y);
    if (dist > 220){ from = p; dist = 0; }        // a jump onto the screen is not a stroke
    last = p;
    pointer.x = p.x; pointer.y = p.y;

    var steps = Math.max(1, Math.ceil(dist / 4));
    var took = 0;
    for (var s = 1; s <= steps; s++){
      var t = s / steps;
      var x = from.x + (p.x - from.x) * t;
      var y = from.y + (p.y - from.y) * t;
      for (var i = 0; i < lines.length; i++){
        if (!lines[i].done) took += eat(lines[i], x, y);
      }
    }

    if (took > 0){
      suction = Math.min(1, suction + took * 12);
      buzz(5);
    }
    for (var j = 0; j < lines.length; j++){
      if (!lines[j].done && lines[j].remaining < 0.05) finish(lines[j]);
    }
  }

  stage.addEventListener('pointerdown', function(e){
    if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
    pointer.down = true;
    audioOn();
    sweep(pos(e));
    e.preventDefault();
  });

  stage.addEventListener('pointermove', function(e){
    if (e.getCoalescedEvents){
      var all = e.getCoalescedEvents();
      for (var i = 0; i < all.length; i++) sweep(pos(all[i]));
      if (!all.length) sweep(pos(e));
    } else {
      sweep(pos(e));
    }
    e.preventDefault();
  });

  function release(e){
    pointer.down = false;
    last = null;
    if (e && e.pointerId !== undefined && stage.hasPointerCapture && stage.hasPointerCapture(e.pointerId)){
      stage.releasePointerCapture(e.pointerId);
    }
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', function(){ pointer.down = false; last = null; });

  /* ---------- sound ---------- */

  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, master = null, noise = null, band = null, hiss = null;

  function noiseBuffer(seconds){
    var n = Math.floor(ac.sampleRate * seconds);
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function audioOn(){
    if (!AC ) return;
    if (!ac){
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(ac.destination);

      // continuous intake hiss, opened only while powder is actually moving
      noise = ac.createBufferSource();
      noise.buffer = noiseBuffer(2);
      noise.loop = true;
      band = ac.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 900;
      band.Q.value = 1.1;
      hiss = ac.createGain();
      hiss.gain.value = 0;
      noise.connect(band).connect(hiss).connect(master);
      noise.start();
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function sniff(){
    if (!ac ) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(0.8);
    var f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 1.6;
    f.frequency.setValueAtTime(420, t);
    f.frequency.exponentialRampToValueAtTime(2600, t + 0.32);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.44);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.5);
  }

  function rush(){
    if (!ac ) return;
    var t = ac.currentTime;
    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(74, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 1.5);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + 1.8);

    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(2);
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(260, t);
    lp.frequency.exponentialRampToValueAtTime(4200, t + 0.9);
    lp.frequency.exponentialRampToValueAtTime(300, t + 1.8);
    var ng = ac.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.16, t + 0.7);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    src.connect(lp).connect(ng).connect(master);
    src.start(t);
    src.stop(t + 1.9);
  }

  function buzz(pattern){
        if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (err) {} }
  }

  /* ---------- render ---------- */

  function drawRoom(){
    // nothing but black glass: no tray, no gradient, no sheen
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(powder, 0, 0, W, H);
  }

  function drawFlying(dt){
    for (var i = flying.length - 1; i >= 0; i--){
      var p = flying[i];
      var dx = pointer.x - p.x, dy = pointer.y - p.y;
      var d = Math.hypot(dx, dy) || 1;
      var pull = 2600 / Math.max(28, d);
      p.vx += (dx / d) * pull * dt;
      p.vy += (dy / d) * pull * dt;
      p.vx *= 0.9; p.vy *= 0.9;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt * 1.5;
      if (p.life <= 0 || d < 9){ flying.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(246,250,255,' + (p.life * 0.75).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, 6.2832);
      ctx.fill();
    }
  }

  var prev = 0;
  function frame(time){
    var dt = Math.min(0.05, (time - prev) / 1000) || 0.016;
    prev = time;

    drawRoom();
    drawFlying(dt);

    suction = Math.max(0, suction - dt * 3.2);
    if (hiss && ac){
      var target = suction * 0.3;
      hiss.gain.value += (target - hiss.gain.value) * 0.25;
      band.frequency.value = 700 + suction * 1500;
    }
    requestAnimationFrame(frame);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(layout, 180);
  });

  layout();
  requestAnimationFrame(frame);

  // installed to the home screen, it runs with no network at all
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')['catch'](function(){});
    });
  }
})();
</script>
</body>
</html>
